spring:
  application:
    name: zing-canteen
  
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/defaultdb}
    username: ${DB_USER:avnadmin}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:DefaultSuperSecretKeyThatIsLongEnoughForHMACSHA256}
  expiration: 86400000 # 24 hours

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_xxxxxx}
  key-secret: ${RAZORPAY_KEY_SECRET:xxxxxx}
