spring:
  application:
    name: zing-canteen
  
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zing_canteen?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:8f7e6d5c4b3a2910f1e2d3c4b5a69788f7e6d5c4b3a2910f1e2d3c4b5a69788f} # Default secret for dev
  expiration: 86400000 # 24 hours

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_xxxxxx}
  key-secret: ${RAZORPAY_KEY_SECRET:xxxxxx}
